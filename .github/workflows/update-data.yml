name: Update tournament data

on:
  schedule:
    # Nightly at 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Liquipedia data
        run: python scripts/fetch_liquipedia_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tournaments.json data/matches.json data/_page_cache.json data/_name_cache.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update tournament data"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5) - another run landed on main first; merging and retrying..."
            git fetch origin main
            git reset --soft origin/main
            python scripts/merge_and_regenerate.py
            git add data/tournaments.json data/matches.json data/_page_cache.json data/_name_cache.json
            git commit -m "Update tournament data"
            sleep $((i * 5))
          done
          echo "::error::Failed to push after 5 attempts - manual intervention needed."
          exit 1
